name: Gemini Tool Pipeline

on:
  workflow_dispatch:

jobs:
  run-tool-builder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer and Stealth
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Run Builder Engine
        env:
          GEMINI_COOKIE: ${{ secrets.GEMINI_COOKIE }}
          GEMINI_CHAT_ID: ${{ secrets.GEMINI_CHAT_ID }}
        run: node runner.js
