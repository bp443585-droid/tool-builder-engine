name: Gemini Tool Pipeline

on:
  workflow_dispatch:

jobs:
  fetch-latest-tool:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Run Fetcher Script
        env:
          GEMINI_COOKIE: ${{ secrets.GEMINI_COOKIE }}
          SNLM0E_TOKEN: ${{ secrets.SNLM0E_TOKEN }}
          GEMINI_CHAT_ID: ${{ secrets.GEMINI_CHAT_ID }}
        run: node runner.js
