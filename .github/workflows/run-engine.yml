name: Gemini Tool Pipeline

on:
  workflow_dispatch: # GitHub UI me manual run karne ka button dega

jobs:
  build-and-parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Tool Builder Engine
        env:
          GEMINI_COOKIE: ${{ secrets.GEMINI_COOKIE }}
          SNLM0E_TOKEN: ${{ secrets.SNLM0E_TOKEN }}
        run: node runner.js
